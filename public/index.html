<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a38">
  <meta name="robots" content="noindex,nofollow">
  <title>Check-in de Presença · Grande Reunião</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="tag">28/09/2026 · 19h00 · Ressaca</div>
      <h1>Grande Reunião</h1>
      <p class="subtitle">Check-in de presença</p>
      <p class="address">Rua João Duarte Ferreira, 148 — Ressaca</p>
    </section>

    <section class="card">
      <span class="badge">PRESENÇA</span>
      <h2>Registrar presença</h2>
      <p class="lead">Preencha os dados abaixo para concluir o check-in.</p>

      <form id="checkin-form" autocomplete="on">
        <div class="field">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" autocomplete="name" maxlength="120" required placeholder="Seu nome completo">
        </div>

        <div class="field">
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" required placeholder="(12) 99999-9999">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="160" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="field">
          <label for="bairro">Bairro</label>
          <input id="bairro" name="bairro" type="text" maxlength="100" required placeholder="Seu bairro">
        </div>

        <button id="checkin" type="submit">Registrar presença</button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

    </section>

    <footer>Registro de presença · 28 de setembro de 2026</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
