name: Validar Presenca

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicacao Presenca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validar arquivos
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/checkin.php
          test -f public/app.js
          test -f public/styles.css
          test -f Dockerfile

      - name: Build Docker
        run: docker build -t presenca-ci:test .

      - name: Teste HTTP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/presenca-ci-storage
          docker run -d --name presenca-ci -p 127.0.0.1:18081:80             -e PRESENCA_STORAGE=/var/www/storage             -v /tmp/presenca-ci-storage:/var/www/storage             presenca-ci:test
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs presenca-ci
          exit 1
